name: SonarQube

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  # Scope by source repo so identically named fork branches stay separate.
  # The event_name suffix keeps the direct push scan of main apart from
  # no-op workflow_run runs fired by push CI completions.
  group: sonarqube-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube
    permissions:
      contents: read
      pull-requests: read
      checks: write
    # Dependabot pull_request runs never receive secrets, so PR scans run
    # via workflow_run (default-branch context, secrets always available).
    # Privileged job with PR-head checkout: never execute the tree here.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 45
    steps:
      - name: Derive scan arguments
        id: scan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SKIP=false
          ARGS=""
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            ARGS=""
          else
            HEAD_SHA=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
            BRANCH=$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")
            # BRANCH is interpolated into a gh --jq filter below, so its
            # charset must be validated before any use. Validation must fail
            # the job, never skip: a skipped check on a live head passes the gate.
            if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Branch name '$BRANCH' contains unsupported characters; refusing to scan. Rename the branch to only [A-Za-z0-9._/-] to unblock the SonarQube gate."
              exit 1
            fi
            PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$PR_NUMBER" ]; then
              PR_NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                --jq "[.[] | select(.state == \"open\" and .head.ref == \"$BRANCH\")][0].number // empty")
            fi
            if [ -z "$PR_NUMBER" ]; then
              echo "::warning::No open PR found for branch '$BRANCH'; the scan is stale (PR merged or closed). Skipping."
              SKIP=true
            else
              PR_JSON=$(gh pr view "$PR_NUMBER" -R "$REPO" \
                --json headRefOid,baseRefName)
              PR_SHA=$(jq -r '.headRefOid' <<< "$PR_JSON")
              BASE=$(jq -r '.baseRefName' <<< "$PR_JSON")
              if [ "$PR_SHA" != "$HEAD_SHA" ]; then
                echo "::warning::PR #$PR_NUMBER head $PR_SHA does not match scanned SHA $HEAD_SHA; the scan is stale. Skipping."
                SKIP=true
              elif ! [[ "$BASE" =~ ^[A-Za-z0-9._/-]+$ ]] || ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
                echo "::error::Base branch '$BASE' or PR number '$PR_NUMBER' has unsupported characters; refusing to scan."
                exit 1
              else
                ARGS="-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$BRANCH -Dsonar.pullrequest.base=$BASE"
              fi
            fi
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### SonarQube scan skipped"
              echo "No analysis ran for this event ($EVENT_NAME); see the warnings in the derive step log for the reason."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: success() && steps.scan.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Pin scanner config to main
        # PR-supplied sonar-project.properties is untrusted: a PR could point
        # sonar.sources outside the workspace and upload arbitrary runner
        # files. Always scan with the reviewed config from main.
        if: success() && steps.scan.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "origin/main:sonar-project.properties"; then
            git show "origin/main:sonar-project.properties" > sonar-project.properties
          else
            echo "::error::sonar-project.properties is missing from origin/main; refusing to fall back to the untrusted PR-supplied config."
            exit 1
          fi
      - name: SonarQube Scan
        if: success() && steps.scan.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9001
        with:
          args: ${{ steps.scan.outputs.args }}
      - name: Print failing quality gate conditions
        if: failure()
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          BASE="http://localhost:9001"
          curl -sS --max-time 10 -u "$SONAR_TOKEN:" \
            "$BASE/api/qualitygates/project_status?projectKey=VidiomTM_subtitle-correction" \
            | jq '.projectStatus.conditions[] | select(.status=="ERROR")' || true
      - name: Report result to the PR head
        # workflow_run check runs attach to the default-branch SHA, so the
        # PR's required SonarQube check must be created on the PR head SHA.
        if: always() && github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          SKIPPED: ${{ steps.scan.outputs.skip }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$SKIPPED" = "true" ]; then
            CONCLUSION="skipped"
            SUMMARY="Scan skipped as stale; see the workflow log for the reason."
          elif [ "$JOB_STATUS" = "success" ]; then
            CONCLUSION="success"
            SUMMARY="SonarQube scan completed and passed the quality gate."
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            CONCLUSION="cancelled"
            SUMMARY="SonarQube run was cancelled, typically because a newer run superseded it."
          else
            CONCLUSION="failure"
            SUMMARY="SonarQube scan failed or the job errored; see the run log."
          fi
          gh api "repos/$REPO/check-runs" --method POST \
            -f name="SonarQube" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="$CONCLUSION" \
            -f "output[title]=SonarQube" \
            -f "output[summary]=$SUMMARY" \
            -f "details_url=https://github.com/$REPO/actions/runs/$RUN_ID" \
            --jq '.id'
  fork-notice:
    name: SonarQube (fork)
    permissions:
      checks: write
    # Fork runs are excluded from the privileged scan job, so they would
    # never receive a SonarQube check and the required context would leave
    # the PR stuck on "Expected". Post an explicit skipped check instead.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 5
    steps:
      - name: Report skipped scan to the fork PR head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/check-runs" --method POST \
            -f name="SonarQube" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="skipped" \
            -f "output[title]=SonarQube" \
            -f "output[summary]=Fork pull requests are not analyzed. SonarQube scans require the privileged workflow_run path, which only runs for same-repo PRs." \
            -f "details_url=https://github.com/$REPO/actions/runs/$RUN_ID" \
            --jq '.id'
