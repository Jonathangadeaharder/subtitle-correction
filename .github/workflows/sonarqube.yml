name: SonarQube

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarqube:
    name: SonarQube
    # Dependabot pull_request runs never receive secrets (GitHub platform
    # behavior), so PR scans run via workflow_run, which executes in the
    # default-branch context and always has secret access. Runs on any CI
    # conclusion so a failed CI cannot silently bypass this required check.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Derive scan arguments
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            ARGS=""
          else
            HEAD_SHA=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
            BRANCH=$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")
            PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$PR_NUMBER" ]; then
              PR_NUMBER=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
                --json number --jq '.[0].number // empty')
            fi
            if [ -z "$PR_NUMBER" ]; then
              echo "::warning::No open PR found for branch '$BRANCH'; the scan is stale (PR merged or closed). Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              PR_SHA=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid --jq .headRefOid)
              if [ "$PR_SHA" != "$HEAD_SHA" ]; then
                echo "::warning::PR #$PR_NUMBER head $PR_SHA does not match scanned SHA $HEAD_SHA; the scan is stale. Skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                ARGS="-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$BRANCH -Dsonar.pullrequest.base=main"
              fi
            fi
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        if: steps.scan.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9001
        with:
          args: ${{ steps.scan.outputs.args }}
      - name: Print failing quality gate conditions
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          BASE="http://localhost:9001"
          curl -sS --max-time 10 -u "$SONAR_TOKEN:" \
            "$BASE/api/qualitygates/project_status?projectKey=VidiomTM_subtitle-correction" \
            | jq '.projectStatus.conditions[] | select(.status=="ERROR")' || true
