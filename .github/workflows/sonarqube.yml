name: SonarQube

on:
  workflow_run:
    # Hard dependency: the trigger matches the CI workflow by name, so
    # renaming CI silently breaks the required SonarQube check. Both PR and
    # main scans arrive here: CI runs on pull_request and on push to main.
    workflows: [CI]
    types: [completed]

concurrency:
  # Keyed by head SHA: a run for a superseded SHA can never cancel the
  # current head's in-flight scan; only same-SHA reruns cancel each other.
  # The repository scope keeps identically named fork branches separate,
  # and the event kind keeps a PR-event and push-event scan of the same
  # SHA (fast-forward merges) from cancelling each other.
  group: sonarqube-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Single source of truth for the check-run name; branch protection's
  # required context must match this string exactly.
  CHECK_NAME: SonarQube

jobs:
  sonarqube:
    # Distinct from CHECK_NAME: this job's automatic check run attaches to
    # the default-branch SHA and must not share the required context name.
    name: SonarQube scan
    permissions:
      contents: read
      pull-requests: read
      checks: write
      # Required to download the coverage artifact from the CI run.
      actions: read
    # Dependabot pull_request runs never receive secrets, so scans run
    # via workflow_run (default-branch context, secrets always available).
    # Privileged job with PR-head checkout: never execute the tree here.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 45
    steps:
      - name: Derive scan arguments
        id: scan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SKIP=false
          ARGS=""
          HEAD_SHA=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
          EVENT_KIND=$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")
          CI_CONCLUSION=$(jq -r '.workflow_run.conclusion' "$GITHUB_EVENT_PATH")
          echo "ci_conclusion=$CI_CONCLUSION" >> "$GITHUB_OUTPUT"
          # A red or cancelled CI must never yield a green SonarQube check:
          # fail here so the reporter posts failure on the live head.
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "::error::Triggering CI run concluded '$CI_CONCLUSION'; the scan only runs on a green CI. Fix CI and push to re-run."
            exit 1
          fi
          load_pr() {
            PR_JSON=$(gh pr view "$1" -R "$REPO" --json headRefOid,baseRefName,state)
            PR_SHA=$(jq -r '.headRefOid' <<< "$PR_JSON")
            BASE=$(jq -r '.baseRefName' <<< "$PR_JSON")
            PR_STATE=$(jq -r '.state' <<< "$PR_JSON")
          }
          if [ "$EVENT_KIND" = "pull_request" ]; then
            BRANCH=$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH")
            # BRANCH is interpolated into gh filters below, so its charset
            # must be validated before any use. Validation failures fail
            # the job: the author gets a loud, actionable error instead of
            # a silently dropped event.
            if ! [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::Branch name '$BRANCH' contains unsupported characters; refusing to scan. Rename the branch to [A-Za-z0-9._/-] only, starting with an alphanumeric, to unblock the SonarQube gate."
              exit 1
            fi
            PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$PR_NUMBER" ]; then
              # Rows include closed/merged PRs: their presence separates a
              # genuinely stale scan from a lookup miss on a live head.
              PR_ROWS=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                --jq '.[] | "\(.number)\t\(.state)\t\(.head.ref)"')
              PR_NUMBER=$(awk -F'\t' -v b="$BRANCH" '$2 == "open" && $3 == b {print $1; exit}' <<< "$PR_ROWS")
              if [ -z "$PR_NUMBER" ] && [ -z "$PR_ROWS" ]; then
                echo "::error::No pull requests found for scanned SHA $HEAD_SHA; this may be a live head whose association has not propagated yet. Push again: re-running this workflow later than one day fails anyway, the coverage artifact from the triggering CI run expires after retention-days: 1."
                exit 1
              fi
            fi
            if [ -z "$PR_NUMBER" ]; then
              echo "::warning::No open PR found for branch '$BRANCH'; the scan is stale (PR merged or closed)."
              SKIP=true
            elif ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::PR number '$PR_NUMBER' is not a plain integer; refusing to scan."
              exit 1
            else
              load_pr "$PR_NUMBER"
              if [ "$PR_SHA" != "$HEAD_SHA" ] || [ "$PR_STATE" != "OPEN" ]; then
                # payload [0] can pick another PR sharing the SHA (order
                # is unspecified, entries carry no state): re-resolve from
                # the branch-based rows before treating the scan as stale.
                ALT_PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                  --jq '.[] | "\(.number)\t\(.state)\t\(.head.ref)"' \
                  | awk -F'\t' -v b="$BRANCH" \
                  '$2 == "open" && $3 == b {print $1; exit}')
                if [ -n "$ALT_PR" ] && [ "$ALT_PR" != "$PR_NUMBER" ]; then
                  PR_NUMBER="$ALT_PR"
                  load_pr "$PR_NUMBER"
                fi
              fi
              if [ "$PR_SHA" != "$HEAD_SHA" ]; then
                echo "::warning::PR #$PR_NUMBER head $PR_SHA does not match scanned SHA $HEAD_SHA; the scan is stale."
                SKIP=true
              elif [ "$PR_STATE" != "OPEN" ]; then
                echo "::warning::PR #$PR_NUMBER is $PR_STATE; the scan is stale."
                SKIP=true
              elif ! [[ "$BASE" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
                echo "::error::Base branch '$BASE' contains unsupported characters; refusing to scan."
                exit 1
              else
                # Community Build rejects sonar.pullrequest.* (Developer
                # Edition only, see issue #18): scan the PR head bare.
                # The bare analysis is attributed to the main branch.
                echo "::notice::PR decoration disabled: the SonarQube server is Community Build and rejects sonar.pullrequest.* properties. Scanning PR #$PR_NUMBER head as a plain analysis attributed to the project's main branch; the next main-branch scan overwrites it."
                ARGS="-Dsonar.python.coverage.reportPaths=coverage.xml"
              fi
            fi
          else
            # workflow_run of CI's push runs: a plain main-branch scan.
            ARGS="-Dsonar.python.coverage.reportPaths=coverage.xml"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### SonarQube scan skipped"
              echo "No analysis ran and no check was posted for this event ($EVENT_KIND); the required context stays on 'Expected'. See the warnings in the derive step log for the reason."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        # The checked-out tree is untrusted PR code: never leave the
        # GITHUB_TOKEN persisted in its .git/config.
        if: success() && steps.scan.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin scanner config to main
        # The scanner must be driven only by this pinned config from main,
        # never by PR-supplied properties: a PR could point sonar.sources
        # outside the workspace and upload arbitrary runner files.
        if: success() && steps.scan.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # rm -rf unlinks symlinks without following them and also removes
          # a directory at this path (rm -f would abort the pin step
          # before the origin/main fallback could speak, issue #24).
          rm -rf sonar-project.properties
          if git cat-file -e "origin/main:sonar-project.properties"; then
            git show "origin/main:sonar-project.properties" > sonar-project.properties
          else
            echo "::error::sonar-project.properties is missing from origin/main; refusing to fall back to the untrusted PR-supplied config."
            exit 1
          fi
      - name: Download coverage report from the CI run
        # Only the unprivileged CI job may run tests, so the coverage report
        # is pulled from the triggering CI run's artifact instead of ever
        # executing the tree here. The artifact name must match ci.yml's upload.
        if: success() && steps.scan.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          ZIP_PATH: ${{ runner.temp }}/sc-coverage.zip
        run: |
          set -euo pipefail
          # rm never follows symlinks: a PR committing coverage-report or
          # coverage.xml as a symlink must not redirect writes outside
          # the workspace.
          rm -rf coverage-report coverage.xml
          # A bulk artifact download would extract every archive member
          # inside the privileged workspace before any check could run,
          # and the artifact is built by the PR's own CI: fetch the zip
          # raw, bound it, extract only the coverage.xml member, and
          # validate the report before the scanner parses it (issue #24).
          read -r ARTIFACT_ID SIZE <<<"$(gh api --paginate "repos/$REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "coverage") | "\(.id) \(.size_in_bytes)"')"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::coverage artifact not found in CI run $CI_RUN_ID"
            exit 1
          fi
          if [ "${SIZE:-0}" -gt $((256 * 1024 * 1024)) ]; then
            echo "::error::coverage artifact too large ($SIZE bytes)"
            exit 1
          fi
          trap 'rm -f "$ZIP_PATH"' EXIT
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$ZIP_PATH"
          # Trusted stdlib python in isolated mode only, never repo code
          # from the untrusted tree (ADR 0001 invariant).
          python3 -I - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          limit = 256 * 1024 * 1024
          with zipfile.ZipFile(os.environ["ZIP_PATH"]) as archive:
              if "coverage.xml" not in archive.namelist():
                  print("::error::coverage artifact has no coverage.xml entry")
                  sys.exit(1)
              written = 0
              with archive.open("coverage.xml") as src:
                  # The report lands at the workspace root, outside
                  # sonar.sources=subtitle_correction: the scanner never
                  # walks it as source input, and no archive-supplied
                  # path is ever followed.
                  with open("coverage.xml", "wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          written += len(chunk)
                          if written > limit:
                              print("::error::coverage.xml exceeds 256 MiB while extracting")
                              sys.exit(1)
                          dst.write(chunk)
          if written == 0:
              print("::error::coverage.xml is empty")
              sys.exit(1)
          if os.path.islink("coverage.xml") or not os.path.isfile("coverage.xml"):
              print("::error::coverage.xml must be a regular file, not a symlink")
              sys.exit(1)
          data = open("coverage.xml", "rb").read()
          # A BOM-less UTF-16/32 report is valid UTF-8 (ASCII interleaved
          # with NULs), so expat auto-detects the real encoding and
          # expands a hidden DTD: reject NUL first.
          if b"\x00" in data:
              print("::error::coverage.xml must be UTF-8 encoded")
              sys.exit(1)
          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError:
              print("::error::coverage.xml must be UTF-8 encoded")
              sys.exit(1)
          if "<!DOCTYPE" in text or "<!ENTITY" in text:
              print("::error::coverage.xml must not contain DTD or entity declarations")
              sys.exit(1)
          parsed = ET.fromstring(data)
          classes = list(parsed.iter("class"))
          if not classes:
              print("::error::coverage.xml has no class entries; the report is empty")
              sys.exit(1)
          # coverage.py emits the CI runner's absolute workspace path in
          # <source>, which differs from this job's tree: anchor the
          # mapping here and keep class filenames relative and contained.
          for source in parsed.findall("./sources/source"):
              source.text = "."
          root = os.path.realpath(os.getcwd())
          for cls in classes:
              name = cls.get("filename", "")
              if os.path.isabs(name) or ".." in name.split("/"):
                  print(f"::error::coverage file path {name!r} escapes the workspace")
                  sys.exit(1)
          # Pull_request CI measures the merge commit while this job
          # scans the PR head: entries for files missing from this tree
          # cannot be mapped by the scanner anyway, drop them.
          for classes_el in parsed.iter("classes"):
              for cls in list(classes_el):
                  name = cls.get("filename", "")
                  if not os.path.isfile(os.path.join(root, name)):
                      print(f"::warning::coverage file path {name!r} not in the scanned tree, removed")
                      classes_el.remove(cls)
          # A broken source mapping can drop every entry: refuse to hand
          # the scanner an empty report instead of scanning 0% silently.
          if not list(parsed.iter("class")):
              print("::error::coverage.xml has no class entries after filtering; refusing to scan an empty report")
              sys.exit(1)
          ET.ElementTree(parsed).write("coverage.xml", encoding="UTF-8", xml_declaration=True)
          PY
      - name: SonarQube Scan
        if: success() && steps.scan.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9001
        with:
          args: ${{ steps.scan.outputs.args }}
      - name: Print failing quality gate conditions
        if: failure()
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          BASE="http://localhost:9001"
          # Single source of truth for the key is the pinned properties file.
          # This step also runs on pre-pin failures: guard instead of
          # querying with an empty key.
          PROJECT_KEY=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties 2>/dev/null || true)
          if [ -z "$PROJECT_KEY" ]; then
            echo "::warning::No pinned sonar-project.properties in this run; cannot print quality-gate conditions."
            exit 0
          fi
          curl -sS --max-time 10 -u "$SONAR_TOKEN:" \
            "$BASE/api/qualitygates/project_status?projectKey=$PROJECT_KEY" \
            | jq '.projectStatus.conditions[] | select(.status=="ERROR")' || true
      - name: Report result to the PR head
        # workflow_run check runs attach to the default-branch SHA, so the
        # PR's required SonarQube check must be created on the PR head SHA.
        # Only PR events carry a required context; push-run results live in
        # this workflow's own check run.
        if: always() && github.event.workflow_run.event == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          SKIPPED: ${{ steps.scan.outputs.skip }}
          CI_CONCLUSION: ${{ steps.scan.outputs.ci_conclusion }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Bounded retry: a transient POST failure would leave the
          # required check on "Expected" with no signal on the PR itself.
          post_with_retry() {
            local i
            for i in 1 2 3; do
              if gh api "$@"; then
                return 0
              fi
              [ "$i" = 3 ] && return 1
              sleep $((i * 5))
            done
          }
          if [ "$SKIPPED" = "true" ]; then
            # A stale scan posts nothing: a "skipped" conclusion satisfies
            # required checks, so posting one could let a close-and-reopen
            # race pass the gate. "Expected" blocks the merge safely.
            echo "Stale scan; no check posted. The required SonarQube context stays on 'Expected' until the branch becomes live again."
            exit 0
          fi
          if [ -n "${CI_CONCLUSION:-}" ] && [ "$CI_CONCLUSION" != "success" ]; then
            CONCLUSION="failure"
            SUMMARY="Triggering CI run concluded '$CI_CONCLUSION'; SonarQube did not scan. Fix CI and push."
          elif [ "$JOB_STATUS" = "success" ]; then
            CONCLUSION="success"
            SUMMARY="SonarQube scan of the PR head completed. Community Build has no per-PR decoration: the analysis is attributed to the project's main branch until the next main scan."
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            # A concurrency-cancelled run posts this 'cancelled' check; the
            # superseding run owns the final conclusion. Chained cancels
            # leave this transient check until some run for the SHA ends.
            CONCLUSION="cancelled"
            SUMMARY="SonarQube run was cancelled, typically because a newer run superseded it."
          else
            CONCLUSION="failure"
            SUMMARY="SonarQube scan failed or the job errored; see the run log."
          fi
          post_with_retry "repos/$REPO/check-runs" --method POST \
            -f name="$CHECK_NAME" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="$CONCLUSION" \
            -f "output[title]=$CHECK_NAME" \
            -f "output[summary]=$SUMMARY" \
            -f "details_url=https://github.com/$REPO/actions/runs/$RUN_ID" \
            --jq '.id'
  fork-notice:
    name: SonarQube (fork)
    permissions:
      checks: write
    # Fork runs never reach the privileged scan job, so the required check
    # would stay on "Expected". action_required keeps the gate honest:
    # "skipped" satisfies required checks and lets fork PRs bypass review.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 5
    steps:
      - name: Report unanalyzed fork PR to the PR head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Bounded retry: a transient POST failure would leave the fork
          # PR's required check on "Expected" with no signal at all.
          post_with_retry() {
            local i
            for i in 1 2 3; do
              if gh api "$@"; then
                return 0
              fi
              [ "$i" = 3 ] && return 1
              sleep $((i * 5))
            done
          }
          post_with_retry "repos/$REPO/check-runs" --method POST \
            -f name="$CHECK_NAME" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="action_required" \
            -f "output[title]=$CHECK_NAME" \
            -f "output[summary]=Fork pull requests are not analyzed by SonarQube. A maintainer must review the code and override this required check to merge." \
            -f "details_url=https://github.com/$REPO/actions/runs/$RUN_ID" \
            --jq '.id'
