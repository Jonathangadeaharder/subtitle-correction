name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Rapid PR updates cancel the superseded CI run instead of queueing
  # redundant full runs on the self-hosted runner. Push runs to main are
  # never cancelled: the SonarQube workflow_run fires on 'cancelled' too
  # and fails the scan by design, so a cancelled main run would leave the
  # earlier commit unanalyzed in a rapid-push window.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run pytest --cov-report=xml
      - run: uv run python -m compileall subtitle_correction
      # Consumed by the SonarQube workflow_run scan, which never runs
      # tests. Only green runs upload; a green run missing coverage.xml
      # fails here at the point of origin, not as a scan-side download error.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1
