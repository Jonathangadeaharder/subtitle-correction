name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Rapid pushes or PR updates cancel the superseded CI run instead of
  # queueing redundant full runs on the self-hosted runner.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run pytest --cov-report=xml
      - run: uv run python -m compileall subtitle_correction
      # Coverage artifact consumed by the SonarQube workflow_run scan,
      # which must never run tests in its privileged job. Only green runs
      # upload: red or cancelled CI runs never reach a scan.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
